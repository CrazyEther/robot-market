{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Демонстрационный выбор процессов роботизации склада, аэропорта и медицинского учреждения.">
  <link rel="icon" href="{% static 'demo/favicon.svg' %}" type="image/svg+xml">
  <title>{% block title %}Роботизация объектов{% endblock %} — robot-market</title>
  <link rel="stylesheet" href="{% static 'demo/style.css' %}">
</head>
<body>
  <header class="header">
    <div class="shell header-row"><a class="brand" href="{% url 'index' %}">robot<span>market</span><span class="brand-dot">.</span></a><span class="header-note">Платформа оценки роботизации <span class="version">· демоверсия</span></span></div>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <footer class="footer"><div class="shell footer-row"><span>Демонстрационные сценарии · Синтетические параметры</span><span>Инженерная применимость и расчёты требуют проверки</span></div></footer>
</body>
</html>
